plugins {
    id 'groovy'
    id 'dev.architectury.loom' version '1.10-SNAPSHOT'
    id 'maven-publish'
}

group = project.maven_group
version = project.mod_version

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases'
    }
    maven { url = 'https://maven.su5ed.dev/releases' }
    maven { url = 'https://maven.shedaniel.me/' }
    maven { url = 'https://maven.wispforest.io/releases/' }
}

sourceSets {
    main {
        java {
            srcDir 'src/client/java'
            exclude 'com/convallyria/taleofkingdoms/client/config/TaleOfKingdomsModMenu.java'
        }
        resources {
            srcDir 'src/client/resources'
            srcDirs += ['src/main/generated']
            exclude 'assets/schematics'
            exclude 'fabric.mod.json'
        }
    }
}
dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.9.0'
    testImplementation 'com.google.code.gson:gson:2.10'
    testImplementation 'org.reflections:reflections:0.10.2'
    compileOnly 'org.jetbrains:annotations:23.0.0'

    minecraft "net.minecraft:minecraft:${project.minecraft_version}"
    mappings loom.layered {
        it.mappings("net.fabricmc:yarn:${project.yarn_mappings}:v2")
        it.mappings("dev.architectury:yarn-mappings-patch-neoforge:${project.yarn_mappings_patch_version}")
    }
    neoForge "net.neoforged:neoforge:${project.neoforge_version}"

    // NeoForge migration bridge for Fabric API calls; Connector is not required.
    modImplementation "org.sinytra.forgified-fabric-api:forgified-fabric-api:${project.forgified_fabric_api_version}"
    modImplementation "me.shedaniel.cloth:cloth-config-neoforge:${project.cloth_version}"
    modImplementation "io.wispforest:owo-lib-neoforge:${project.owo_neoforge_version}"

    // Compile-only until the remaining EnvType annotations are migrated.
    modCompileOnly "net.fabricmc:fabric-loader:${project.loader_version}"

    // owo-lib runtime libraries for NeoForge 1.21.1 under Architectury Loom.
    forgeRuntimeLibrary "blue.endless:jankson:1.2.2"
    forgeRuntimeLibrary "io.wispforest:endec:0.1.5.1"
    forgeRuntimeLibrary "io.wispforest.endec:netty:0.1.2"
    forgeRuntimeLibrary "io.wispforest.endec:gson:0.1.3.1"
    forgeRuntimeLibrary "io.wispforest.endec:jankson:0.1.3.1"

    implementation 'org.apache.groovy:groovy:4.0.7'
}

processResources {
    inputs.property 'version', project.version
    filesMatching('META-INF/neoforge.mods.toml') {
        expand version: project.version
    }
    from('CHANGELOG.md')
}

tasks {
    jar {
        duplicatesStrategy = DuplicatesStrategy.WARN
        from file('src/main/generated')
        from('LICENSE') {
            rename { "${it}_${project.base.archivesName.get()}" }
        }
    }

    test {
        useJUnitPlatform()
        testLogging {
            events('passed', 'skipped', 'failed')
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = 'UTF-8'
    options.compilerArgs << '-Xlint:all'
    options.deprecation = true
    it.options.release = 21
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

publishing {
    publications {
        create('mavenJava', MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }
}
