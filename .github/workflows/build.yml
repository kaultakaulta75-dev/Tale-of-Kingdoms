# Build and test every porting change.
name: build

on:
  push:
    branches:
      - master
      - "port/**"
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build
        run: ./gradlew build --stacktrace

      - name: Prepare production NeoForge server
        shell: bash
        run: |
          mkdir -p production-server/mods
          curl --fail --location --output neoforge-installer.jar \
            https://maven.neoforged.net/releases/net/neoforged/neoforge/21.1.248/neoforge-21.1.248-installer.jar
          (
            cd production-server
            java -jar ../neoforge-installer.jar --installServer
          )

          find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*sources.jar' \
            -exec cp {} production-server/mods/ \;

          copy_dependency() {
            local pattern="$1"
            local dependency
            dependency="$(find "${GRADLE_USER_HOME}/caches/modules-2/files-2.1" -type f \
              -name "${pattern}" ! -name '*sources*' ! -name '*dev*' | head -n 1)"
            if [[ -z "${dependency}" ]]; then
              echo "Dependency not found: ${pattern}" >&2
              exit 1
            fi
            cp "${dependency}" production-server/mods/
          }

          copy_dependency 'forgified-fabric-api-0.116.15+2.3.5+1.21.1.jar'
          copy_dependency 'cloth-config-neoforge-15.0.140-neoforge.jar'
          copy_dependency 'owo-lib-neoforge-0.12.15.5-beta.1+1.21.jar'
          echo 'eula=true' > production-server/eula.txt
          ls -lh production-server/mods

      - name: Smoke-test production dedicated server startup
        shell: bash
        run: |
          set +e
          (
            cd production-server
            timeout 180s ./run.sh nogui
          ) > server-smoke.log 2>&1
          status=$?
          set -e
          cat server-smoke.log
          if grep -q "Done (" server-smoke.log; then
            exit 0
          fi
          echo "Server did not reach the ready state (process status: ${status})" >&2
          exit 1

      - name: Upload server smoke-test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tale-of-kingdoms-server-smoke-log
          path: server-smoke.log
          if-no-files-found: ignore

      - name: Upload complete client mod pack
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: tale-of-kingdoms-neoforge-1.21.1-complete-mods
          path: production-server/mods/*.jar
          if-no-files-found: error
          retention-days: 90

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tale-of-kingdoms-build
          path: build/libs/
          if-no-files-found: ignore
