# Build and test every porting change.
name: build

on:
  push:
    branches:
      - master
      - "port/**"
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build
        run: ./gradlew build --stacktrace

      - name: Smoke-test dedicated server startup
        shell: bash
        run: |
          mkdir -p run
          echo "eula=true" > run/eula.txt
          set +e
          timeout 120s ./gradlew runServer --args "--nogui" > server-smoke.log 2>&1
          status=$?
          set -e
          cat server-smoke.log
          if grep -q "Done (" server-smoke.log; then
            exit 0
          fi
          exit "${status}"

      - name: Upload server smoke-test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tale-of-kingdoms-server-smoke-log
          path: server-smoke.log
          if-no-files-found: ignore

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tale-of-kingdoms-build
          path: build/libs/
          if-no-files-found: ignore
